aid: astrus
name: Astrus
description: >-
  Astrus is an AI-powered microchip design company automating the physical
  layout of analog circuits. Founded in 2022 by Brad Moon (CEO) and Zeyi Wang
  (CTO) and based in Toronto and Waterloo, Canada, Astrus applies deep
  reinforcement learning — inspired by AlphaGo-style self-play — to generate
  thousands of manufacturable analog chip layouts in seconds, targeting
  high-speed SERDES interconnects used in data-center GPUs. The platform lets
  circuit designers submit a schematic and receive optimized layouts in minutes
  rather than the weeks of manual transistor-by-transistor placement that analog
  EDA traditionally requires. Astrus raised $8M in seed funding led by Khosla
  Ventures with participation from Pradeep Sindhu, 1517 Fund, Drive Capital and
  Alumni Ventures. This profile was surfaced as a Khosla Ventures portfolio
  company; Astrus publishes no public developer API, SDK, or documentation
  surface at this time.
